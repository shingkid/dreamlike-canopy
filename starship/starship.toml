# Dreamlike Canopy for Starship — Design A
# A polished Powerline capsule for the directory, airy contextual modules,
# and a luminous mint prompt character on a clean second line.

"$schema" = "https://starship.rs/config-schema.json"

palette = "dreamlike_canopy"
add_newline = true
scan_timeout = 30
command_timeout = 1_000

format = """
$directory$git_branch$git_status$nodejs$python$rust$golang$package$cmd_duration$line_break$character"""
right_format = "$time"

[palettes.dreamlike_canopy]
# Use terminal ANSI colors so Starship follows Ghostty's active light/dark
# theme without a separate shell configuration.
mist = "white"
capsule = "bright-black"
capsule_text = "bright-white"
mint = "bright-green"
canopy = "green"
lagoon = "cyan"
violet = "bright-magenta"
sunlight = "yellow"
rose = "bright-red"

[directory]
truncation_length = 0
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " "
format = "[](fg:capsule)[ $path$read_only ]($style)[](fg:capsule)  "
style = "fg:capsule_text bg:capsule"

[git_branch]
symbol = ""
format = "[$branch]($style)"
style = "fg:violet"

[git_status]
# Risk is semantic: rose for destructive states, sunlight for remote
# synchronization, canopy green for staged progress, and mist for neutral inventory.
format = "[$conflicted](fg:rose)[$deleted](fg:rose)[$modified](fg:sunlight)[$renamed](fg:sunlight)[$ahead_behind](fg:sunlight)[$staged](fg:canopy)[$untracked](fg:mist)[$stashed](fg:mist)"
conflicted = "~"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2_000
format = "[  took $duration]($style)"
style = "fg:sunlight"

[nodejs]
format = "[  node $version]($style)"
style = "fg:lagoon"

[python]
format = "[  py $version( ($virtualenv))]($style)"
style = "fg:lagoon"

[rust]
format = "[  rs $version]($style)"
style = "fg:lagoon"

[golang]
format = "[  go $version]($style)"
style = "fg:lagoon"

[package]
format = "[  pkg $version]($style)"
style = "fg:mist"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style)"
style = "fg:mist"

[character]
success_symbol = "[❯](fg:mint)"
error_symbol = "[❯](fg:rose)"
vimcmd_symbol = "[❮](fg:canopy)"
