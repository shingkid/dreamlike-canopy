# Dreamlike Canopy for Starship — Compact
# Preserve the adaptive palette and full path while removing runtime/package
# modules for narrow panes and focused terminal work.

"$schema" = "https://starship.rs/config-schema.json"

palette = "dreamlike_canopy"
add_newline = true
scan_timeout = 30
command_timeout = 1_000

format = "$directory$git_branch$git_status$cmd_duration$line_break$character"
right_format = "$time"

[palettes.dreamlike_canopy]
mist = "white"
capsule = "bright-black"
capsule_text = "bright-white"
mint = "bright-green"
canopy = "green"
lagoon = "cyan"
violet = "bright-magenta"
sunlight = "yellow"
coral = "bright-red"

[directory]
truncation_length = 0
truncate_to_repo = false
read_only = " "
format = "[](fg:capsule)[ $path$read_only ]($style)[](fg:capsule)  "
style = "fg:capsule_text bg:capsule"

[git_branch]
symbol = ""
format = "[$branch]($style)"
style = "fg:violet"

[git_status]
format = "[$conflicted](fg:coral)[$deleted](fg:coral)[$modified](fg:sunlight)[$renamed](fg:sunlight)[$diverged](fg:sunlight)[$behind](fg:sunlight)[$ahead](fg:canopy)[$staged](fg:canopy)[$untracked](fg:mist)[$stashed](fg:mist)"
conflicted = "~"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2_000
format = "  [took $duration]($style)"
style = "fg:sunlight"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style)"
style = "fg:mist"

[character]
success_symbol = "[❯](fg:mint)"
error_symbol = "[❯](fg:coral)"
vimcmd_symbol = "[❮](fg:canopy)"
